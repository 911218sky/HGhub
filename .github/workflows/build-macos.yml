name: Build macOS (manual)

# Standalone macOS packages; for full multi-platform releases use the Release workflow (push a v* tag)
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture: arm64 / x64 / universal / all"
        required: true
        default: "universal"

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon (arm64)
            arch: arm64
          - target: x86_64-apple-darwin
            name: Intel (x64)
            arch: x64
          - target: universal-apple-darwin
            name: Universal
            arch: universal

    steps:
      - name: Gate architecture
        id: gate
        shell: bash
        run: |
          WANT="${{ github.event.inputs.arch }}"
          WANT="$(echo "$WANT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$WANT" == "all" || "$WANT" == "${{ matrix.arch }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - name: Sync version
        if: steps.gate.outputs.run == 'true'
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: Collect artifacts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          for f in $(find src-tauri/target -name '*.dmg'); do
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
          done
          for app in $(find src-tauri/target -name 'HGhub.app' -type d); do
            tar -czf "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz" -C "$(dirname "$app")" "HGhub.app"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.run == 'true'
        with:
          name: HGhub-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
