name: Release

# Tag push (v1.2.3): build all platforms and publish a GitHub Release
# Manual run from Actions: artifacts only, no release publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: windows,android,macos,linux or all)"
        required: true
        default: "all"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ---------- Resolve which platforms to run ----------
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      windows: ${{ steps.sel.outputs.windows }}
      android: ${{ steps.sel.outputs.android }}
      macos: ${{ steps.sel.outputs.macos }}
      linux: ${{ steps.sel.outputs.linux }}
      ios: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Select platforms
        id: sel
        shell: bash
        run: |
          RAW="${{ github.event.inputs.platforms || 'all' }}"
          RAW="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          # Tag pushes always build desktop + Android (iOS disabled)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW="all"
          fi
          for p in windows android macos linux; do
            if [[ "$RAW" == "all" || ",$RAW," == *",$p,"* ]]; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # ================= Windows: NSIS + portable zip =================
  windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync version
        shell: bash
        run: |
          V="${{ needs.prepare.outputs.version }}"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # ================= Android: per-ABI APKs =================
  android:
    name: Android
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Sync version
        shell: bash
        run: |
          V="${{ needs.prepare.outputs.version }}"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci
      - run: node scripts/android-arm64-16k.mjs
      # arm64-v8a only. A 32-bit (armeabi-v7a) APK is what triggers
      # "This app isn't compatible with the latest version of Android" on Android 14+.
      - run: pnpm tauri android build --apk --target aarch64

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
          found=0

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="${KEY_ALIAS}"
            STORE_PASS="${STORE_PASSWORD}"
            KEY_PASS="${KEY_PASSWORD}"
            echo "Using ANDROID_KEY_* secrets for signing"
          else
            KS="scripts/android-sideload.keystore"
            ALIAS="hghub"
            STORE_PASS="hghub-sideload"
            KEY_PASS="hghub-sideload"
            echo "::warning::ANDROID_KEY_* secrets not set; signing with repo sideload keystore"
          fi

          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            case "$f" in
              *armeabi-v7a*|*"/arm/"*|*"x86"*) echo "skip non-arm64 $f"; continue ;;
            esac
            aligned="$RUNNER_TEMP/hghub-arm64-aligned.apk"
            out="artifacts/HGhub_${VERSION}_arm64.apk"
            # 16 KB zip alignment, then sign. https://developer.android.com/guide/practices/page-sizes
            "$ZIPALIGN" -f -P 16 4 "$f" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$aligned"
            "$APKSIGNER" verify --verbose "$out"
            "$ZIPALIGN" -c -P 16 4 "$out"
            rm -f "$aligned"
            found=$((found+1))
          done

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            rm -f "$KS"
          fi

          if [ "$found" -eq 0 ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= macOS: Universal dmg =================
  macos:
    name: macOS
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync version
        shell: bash
        run: |
          V="${{ needs.prepare.outputs.version }}"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --target universal-apple-darwin

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
             "artifacts/HGhub_${V}_universal.dmg"
          # Also package a compressed .app
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle -name 'HGhub.app' -type d | head -1)"
          if [ -n "$APP" ]; then
            tar -czf "artifacts/HGhub_${V}_universal.app.tar.gz" -C "$(dirname "$APP")" "HGhub.app"
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  # ================= Linux: deb + AppImage =================
  linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Sync version
        shell: bash
        run: |
          V="${{ needs.prepare.outputs.version }}"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb appimage

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p artifacts
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "artifacts/HGhub_${V}_amd64.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            cp "$f" "artifacts/HGhub_${V}_amd64.AppImage"
          done
          ls -lh artifacts
          test "$(ls -A artifacts)" 

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  # ================= Publish GitHub Release (tag only) =================
  release:
    name: Publish Release
    needs: [prepare, windows, android, macos, linux]
    # Publish when at least one platform artifact succeeded.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.windows.result == 'success' || needs.android.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## HGhub v${{ needs.prepare.outputs.version }}

            | Platform | Files |
            | --- | --- |
            | Windows | `*-setup.exe` / `*_portable.zip` |
            | Android | `*_arm64.apk` |
            | macOS | `*_universal.dmg` |
            | Linux | `*_amd64.deb` / `*.AppImage` |
