name: Build Linux (manual)

# Standalone Linux packages; for full multi-platform releases use the Release workflow (push a v* tag)
on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  linux:
    name: Linux (deb + appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb appimage

      - name: Collect artifacts
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p artifacts
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "artifacts/HGhub_${V}_amd64.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            cp "$f" "artifacts/HGhub_${V}_amd64.AppImage"
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: HGhub-linux
          path: artifacts/*
          if-no-files-found: error
